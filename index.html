<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef6ff">
<title>Adjective → Noun Word Formation | B1–B2 English</title>
<style>
  :root{
    --bg:#eef6ff;
    --card:#ffffff;
    --primary:#4a8fd4;
    --primary-dark:#2f6ea8;
    --primary-soft:#d8eafb;
    --primary-soft-2:#eef6ff;
    --text:#1e3550;
    --muted:#6b87a5;
    --border:#d3e4f5;
    --good:#1f7a55;
    --good-bg:#e8f7f0;
    --good-bd:#a9dcc4;
    --bad:#a13030;
    --bad-bg:#fdf0f0;
    --bad-bd:#f0b9b9;
    --noun:#2b7a63;
    --radius:18px;
    --shadow:0 6px 22px rgba(45,90,140,.10);
    --shadow-sm:0 2px 10px rgba(45,90,140,.08);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
    background:linear-gradient(180deg,#f2f8ff 0%,#e7f1fb 100%);
    background-attachment:fixed;
    color:var(--text);
    line-height:1.55;
    overflow-x:hidden;
  }
  h1,h2,h3,p{margin:0;}
  button{font-family:inherit;}
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }
  :focus-visible{outline:3px solid #2f7fd0;outline-offset:2px;border-radius:10px;}

  /* ---------- HEADER ---------- */
  .app-header{text-align:center;padding:26px 16px 10px;}
  .app-header h1{
    font-size:clamp(1.25rem,4.6vw,2rem);
    letter-spacing:-.02em;
    line-height:1.25;
    color:var(--primary-dark);
    font-weight:800;
  }
  .subtitle{margin-top:6px;color:var(--muted);font-size:clamp(.88rem,2.6vw,1.02rem);}
  .target{
    display:inline-block;margin-top:12px;background:var(--primary-soft);color:var(--primary-dark);
    padding:5px 16px;border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.03em;
  }

  /* ---------- NAV ---------- */
  .tabs-wrap{
    position:sticky;top:0;z-index:30;
    background:rgba(240,247,255,.94);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .tabs{
    display:flex;gap:6px;overflow-x:auto;padding:9px 12px;
    max-width:1040px;margin:0 auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;min-height:44px;padding:10px 16px;border-radius:999px;
    border:1px solid transparent;background:transparent;color:var(--muted);
    font-size:.92rem;font-weight:700;cursor:pointer;white-space:nowrap;
    transition:background .18s,color .18s,box-shadow .18s;
  }
  .tab:hover{background:#fff;color:var(--primary-dark);}
  .tab.active{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(74,143,212,.35);}
  @media(min-width:960px){
    .tabs{flex-wrap:wrap;justify-content:center;overflow:visible;}
  }

  /* ---------- LAYOUT ---------- */
  main{max-width:1040px;margin:0 auto;padding:18px 14px 70px;}
  .view{display:none;}
  .view.active{display:block;animation:fadeUp .3s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px;box-shadow:var(--shadow);margin-bottom:16px;overflow-wrap:break-word;
  }
  .card-title{font-size:1.12rem;font-weight:800;color:var(--primary-dark);margin-bottom:10px;}
  .center{text-align:center;}
  .muted{color:var(--muted);font-size:.92rem;}
  .ok-msg{color:var(--good);font-weight:700;font-size:1.05rem;margin-bottom:6px;}

  .eyebrow{
    font-size:.74rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin-bottom:4px;
  }
  .label{
    display:block;font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);margin-bottom:4px;
  }

  /* ---------- BUTTONS ---------- */
  .btn{
    min-height:48px;padding:12px 20px;border-radius:14px;border:1px solid var(--border);
    background:#fff;color:var(--text);font-size:1rem;font-weight:700;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    transition:background .16s,border-color .16s,color .16s,transform .1s;
    text-align:center;
  }
  .btn:hover{border-color:var(--primary);color:var(--primary-dark);background:#f7fbff;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn.primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff;}
  .btn.good{background:var(--good-bg);border-color:var(--good-bd);color:var(--good);}
  .btn.warn{background:#fff6e7;border-color:#f0d7a6;color:#8f6312;}
  .btn.danger{background:#fdecec;border-color:#f0b9b9;color:var(--bad);}
  .btn.danger:hover{background:#f9dede;border-color:#e39b9b;color:var(--bad);}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--primary-dark);text-decoration:underline;min-height:44px;padding:8px 10px;}
  .btn.ghost:hover{background:var(--primary-soft-2);}
  .btn.lg{min-height:56px;font-size:1.05rem;padding:14px 24px;}
  .btn.small{min-height:44px;padding:8px 14px;font-size:.88rem;}
  .btn.full{width:100%;}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

  .row-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
  .row-actions .btn{flex:1 1 140px;}
  .row-actions.center-row{justify-content:center;}

  /* ---------- STATS ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px;}
  @media(min-width:560px){.stat-grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:900px){.stat-grid{grid-template-columns:repeat(6,1fr);}}
  .stat{
    background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px 8px;
    text-align:center;box-shadow:var(--shadow-sm);
  }
  .stat-num{display:block;font-size:1.55rem;font-weight:800;color:var(--primary-dark);line-height:1.2;}
  .stat-label{display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-top:3px;}

  .progress{
    height:16px;border-radius:999px;background:#e3eefb;overflow:hidden;
    border:1px solid var(--border);
  }
  .progress.thin{height:9px;margin-bottom:14px;}
  .progress-fill{
    height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,#8cc3ee,#4a8fd4);
    transition:width .55s ease;
  }

  /* ---------- CHIPS / TAGS ---------- */
  .chip{
    display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
    background:#fff;border:1px solid var(--border);font-size:.78rem;font-weight:700;color:var(--muted);
  }
  .chip.tiny{font-size:.7rem;padding:4px 10px;}
  .chip-mastered{background:var(--good-bg);border-color:var(--good-bd);color:var(--good);}
  .mode-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
  .tag{
    display:inline-block;padding:3px 10px;border-radius:999px;background:var(--primary-soft-2);
    border:1px solid var(--border);font-size:.72rem;font-weight:700;color:var(--muted);
  }
  .tag-warn{background:#fff6e7;border-color:#f0d7a6;color:#8f6312;}

  /* ---------- LEARN ---------- */
  .big-word{
    font-size:clamp(2rem,9vw,3.1rem);font-weight:800;letter-spacing:-.02em;
    color:var(--primary-dark);line-height:1.12;word-break:break-word;margin:4px 0 6px;
  }
  .big-word.noun{color:var(--noun);}
  .ipa{
    font-size:1.14rem;color:var(--muted);letter-spacing:.02em;margin:2px 0 10px;
    font-family:"Segoe UI","Charis SIL","Doulos SIL","Lucida Sans Unicode","Noto Sans",serif;
    word-break:break-word;
  }
  .level-line{font-size:.85rem;color:var(--muted);margin-bottom:14px;}
  .hint{
    margin:14px 0 16px;padding:14px 16px;border-radius:14px;background:var(--primary-soft-2);
    border:1px dashed #b9d7f2;font-weight:700;color:var(--primary-dark);font-size:.98rem;
  }
  .hint .muted{font-weight:500;font-size:.86rem;}
  .reveal{animation:fadeUp .35s ease;}
  .info-grid{display:grid;gap:12px;margin:14px 0;}
  @media(min-width:560px){.info-grid{grid-template-columns:1fr 1fr;}}
  .info-grid > div{background:var(--primary-soft-2);border-radius:14px;padding:12px 14px;}
  .info-grid p{font-size:1.02rem;font-weight:600;}
  .example{background:#f7fbff;border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:12px;}
  .example p{font-style:italic;font-size:1.02rem;}
  .formation{background:#f4fbf8;border:1px solid #cfe9df;border-radius:14px;padding:12px 14px;}
  .form-line{font-weight:800;color:var(--noun);font-size:1.05rem;letter-spacing:.01em;}
  .why-box{
    margin-top:10px;padding:14px 16px;background:var(--primary-soft-2);
    border-left:4px solid var(--primary);border-radius:12px;font-size:.96rem;
    animation:fadeUp .25s ease;
  }
  .why-btn{margin-top:12px;}

  .audio-block{
    display:flex;flex-direction:column;gap:6px;align-items:flex-start;
    margin:12px 0;padding:12px 14px;border-radius:14px;background:#f7fbff;border:1px solid var(--border);
  }
  .audio-btn{background:var(--primary-soft);border-color:#bcdcf7;color:var(--primary-dark);width:100%;}
  .audio-btn:hover{background:#cbe4fa;}
  .audio-status{font-size:.8rem;color:var(--muted);margin:0;}

  /* ---------- FLASHCARDS ---------- */
  .flashcard{
    position:relative;perspective:1400px;cursor:pointer;
    height:min(58vh,420px);min-height:300px;margin-bottom:16px;
    border-radius:22px;
  }
  .fc-inner{
    position:relative;width:100%;height:100%;
    transition:transform .55s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .flashcard.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);
    padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;overflow:auto;
  }
  .fc-back{transform:rotateY(180deg);background:linear-gradient(180deg,#ffffff 0%,#f4fbff 100%);}
  .fc-word{font-size:clamp(1.6rem,7.5vw,2.6rem);font-weight:800;letter-spacing:-.01em;word-break:break-word;color:var(--primary-dark);line-height:1.15;}
  .fc-back .fc-word{color:var(--noun);}
  .fc-tap{margin-top:16px;font-size:.85rem;color:var(--muted);}
  .fc-vi{margin-top:6px;font-size:1.08rem;font-weight:700;}
  .fc-ex{margin-top:10px;font-style:italic;font-size:.95rem;color:var(--muted);}
  .fc-form{margin-top:12px;font-weight:800;color:var(--noun);font-size:.95rem;}

  /* ---------- QUESTIONS / OPTIONS ---------- */
  .question{font-size:1.1rem;font-weight:600;margin-bottom:4px;line-height:1.5;}
  .question em{color:var(--primary-dark);font-style:italic;}
  .options{display:grid;gap:10px;margin-top:16px;}
  .option{
    min-height:56px;text-align:left;padding:14px 18px;border-radius:14px;
    border:1.5px solid var(--border);background:#fff;font-size:1.04rem;font-weight:600;
    cursor:pointer;color:var(--text);transition:background .15s,border-color .15s;
    display:flex;align-items:center;
  }
  .option:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft-2);}
  .option.correct{background:var(--good-bg);border-color:#5cb98c;color:var(--good);}
  .option.wrong{background:var(--bad-bg);border-color:#e08d8d;color:var(--bad);}
  .option.dim{opacity:.55;}
  .option:disabled{cursor:default;}

  .answer-form{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  @media(min-width:600px){.answer-form{flex-direction:row;}.answer-form .input{flex:1;}}
  .input{
    width:100%;min-height:52px;padding:12px 16px;border-radius:14px;
    border:1.5px solid var(--border);font-size:1.05rem;background:#fff;color:var(--text);
    font-family:inherit;
  }
  .input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(74,143,212,.18);}
  .input:disabled{background:#f5f9fd;}

  .feedback{
    margin-top:16px;padding:16px;border-radius:14px;border:1.5px solid;
    animation:fadeUp .25s ease;
  }
  .feedback.ok{background:var(--good-bg);border-color:var(--good-bd);}
  .feedback.bad{background:var(--bad-bg);border-color:var(--bad-bd);}
  .fb-title{font-size:1.12rem;font-weight:800;margin-bottom:6px;}
  .feedback.ok .fb-title{color:var(--good);}
  .feedback.bad .fb-title{color:var(--bad);}
  .feedback p{font-size:.96rem;margin-bottom:3px;}
  .hint-text{margin-top:10px;padding:10px 12px;background:#fff8e8;border:1px dashed #e8cd93;border-radius:12px;font-size:.92rem;}

  .score-big{font-size:clamp(2.2rem,10vw,3.4rem);font-weight:800;color:var(--primary-dark);line-height:1.1;margin:6px 0;}

  /* ---------- WORD LIST ---------- */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .chip-btn{
    min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid var(--border);
    background:#fff;color:var(--muted);font-size:.86rem;font-weight:700;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .chip-btn:hover{border-color:var(--primary);color:var(--primary-dark);}
  .chip-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .word-list{display:grid;gap:14px;}
  @media(min-width:760px){.word-list{grid-template-columns:1fr 1fr;}}
  .word-card{
    background:#fff;border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow-sm);
  }
  .wc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .wc-form{font-size:1.08rem;font-weight:800;color:var(--primary-dark);word-break:break-word;}
  .wc-form .arrow{color:var(--muted);margin:0 4px;}
  .wc-form .noun{color:var(--noun);}
  .wc-vi{font-weight:700;font-size:.98rem;margin-bottom:4px;}
  .wc-ex{font-style:italic;font-size:.9rem;color:var(--muted);}
  .wc-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;}

  /* ---------- DIALOG ---------- */
  dialog{
    border:none;border-radius:20px;padding:0;max-width:440px;width:calc(100% - 32px);
    box-shadow:0 24px 70px rgba(20,50,90,.35);
  }
  dialog::backdrop{background:rgba(20,50,90,.45);}
  .dialog-body{padding:22px;}
  .dialog-body h2{font-size:1.15rem;font-weight:800;color:var(--primary-dark);margin-bottom:10px;}
  .dialog-body p{font-size:.95rem;color:var(--muted);margin-bottom:6px;}

  /* ---------- MISC ---------- */
  .streak-line{font-size:1.6rem;font-weight:800;color:var(--primary-dark);}
  .daily-msg{font-size:1.05rem;margin-bottom:12px;}
  .stat-row{
    display:flex;justify-content:space-between;gap:12px;padding:10px 0;
    border-bottom:1px solid var(--border);font-size:.95rem;
  }
  .stat-row:last-child{border-bottom:none;}
  .stat-row strong{color:var(--primary-dark);}
  .list-mini{list-style:none;padding:0;margin:0;}
  .list-mini li{
    display:flex;justify-content:space-between;gap:10px;padding:9px 0;
    border-bottom:1px dashed var(--border);font-size:.95rem;
  }
  .list-mini li:last-child{border-bottom:none;}
  .list-mini .mini-form{font-weight:700;}
  .list-mini .mini-form .noun{color:var(--noun);}
  .list-mini .mini-val{color:var(--muted);font-weight:700;white-space:nowrap;}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
      scroll-behavior:auto !important;
    }
  }
</style>
</head>

<header class="app-header">

<nav class="tabs-wrap" aria-label="Main navigation">
  <div class="tabs">

<main id="main">
  <section id="view-home" class="view active" aria-label="Home"></section>
  <section id="view-learn" class="view" aria-label="Learn"></section>
  <section id="view-flashcards" class="view" aria-label="Flashcards"></section>
  <section id="view-words" class="view" aria-label="Word bank"></section>

  <section id="view-quiz" class="view" aria-label="Quiz"></section>

</main>

<dialog id="confirmReset" aria-labelledby="resetTitle">
  <div class="dialog-body">
    <h2 id="resetTitle">Reset Progress?</h2>
    <p>Toàn bộ tiến độ học (mastery, quiz scores, review list, streak) sẽ bị xoá vĩnh viễn.</p>
    <p>This action cannot be undone.</p>
    <div class="row-actions">
      <button type="button" class="btn" data-action="reset-cancel">Cancel</button>
      <button type="button" class="btn danger" data-action="reset-confirm">Reset Progress</button>
    </div>
  </div>
</dialog>

  },
  {
    id:'industry', adj:'industrious', noun:'industry', pos:'noun (uncountable / countable)',

  {

    example:'The project requires continuity.',
    formation:'continuous → continuity',
    why:'Bỏ -ous và thêm -ity: continuous → continuity. Chú ý trọng âm chuyển sang âm tiết thứ ba (-nu-).',
    level:'B2', lessCommon:false
  },
  {
    id:'gorgeousness', adj:'gorgeous', noun:'gorgeousness', pos:'noun (uncountable)',
    ipa:'/ˈɡɔːdʒəsnəs/', vi:'vẻ đẹp lộng lẫy',

/* =========================================================================
   2. STATE + LOCAL STORAGE
   ========================================================================= */
const STORAGE_KEY = 'adjnoun_wordformation_v1';

let state = {
  words: {},
  streak: 0,
  lastStudyDate: null,
  quizzes: []
};

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed === 'object'){
        state.words = parsed.words && typeof parsed.words === 'object' ? parsed.words : {};
        state.streak = typeof parsed.streak === 'number' ? parsed.streak : 0;
        state.lastStudyDate = parsed.lastStudyDate || null;
        state.quizzes = Array.isArray(parsed.quizzes) ? parsed.quizzes : [];
      }
    }
  }catch(e){
    state = { words:{}, streak:0, lastStudyDate:null, quizzes:[] };
  }
}

function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function getRec(id){
  if(!state.words[id]){
    state.words[id] = {
      mastery:0, correct:0, incorrect:0, reviews:0,
      needReview:false, difficult:false, lastStudied:null
    };
  }
  return state.words[id];
}

function masteryOf(id){
  const r = state.words[id];
  return r && typeof r.mastery === 'number' ? r.mastery : 0;
}

function levelLabel(m){
  if(m <= 0) return 'Not started';
  if(m <= 25) return 'Seen';
  if(m <= 50) return 'Practising';
  if(m <= 75) return 'Almost mastered';
  return 'Mastered';
}

/* =========================================================================
   3. HELPERS
   ========================================================================= */
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function escapeRegExp(s){
  return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function dateStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function normAnswer(s){
  return String(s).toLowerCase().trim().replace(/\s+/g, ' ').replace(/[.,!?;:"'’]/g, '');
}

function normSearch(s){
  return String(s)
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd')
    .replace(/Đ/g, 'd');
}

function blankSentence(example, noun){
  const re = new RegExp('\\b' + escapeRegExp(noun) + '\\b', 'i');
  if(re.test(example)) return example.replace(re, '______');
  return example;
}

function buildOptions(correct, pool){
  const unique = [];
  pool.forEach(function(x){ if(x !== correct && unique.indexOf(x) === -1) unique.push(x); });
  const others = shuffle(unique).slice(0, 3);
  return shuffle([correct].concat(others));
}

/* =========================================================================
   4. PROGRESS MUTATIONS
   ========================================================================= */
function touchStreak(){
  const t = dateStr(new Date());
  if(state.lastStudyDate === t) return;
  const y = new Date();
  y.setDate(y.getDate() - 1);
  if(state.lastStudyDate === dateStr(y)){
    state.streak = (state.streak || 0) + 1;
  }else{
    state.streak = 1;
  }
  state.lastStudyDate = t;
}

function markSeen(id){
  const r = getRec(id);
  if(r.mastery === 0) r.mastery = 25;
  r.lastStudied = dateStr(new Date());
  touchStreak();
  saveState();
}

function markCorrect(id){
  const r = getRec(id);
  r.correct = (r.correct || 0) + 1;
  r.reviews = (r.reviews || 0) + 1;
  r.mastery = Math.min(100, (r.mastery || 0) + 25);
  if(r.mastery >= 75) r.needReview = false;
  r.lastStudied = dateStr(new Date());
  touchStreak();
  saveState();
}

function markIncorrect(id){
  const r = getRec(id);
  r.incorrect = (r.incorrect || 0) + 1;
  r.reviews = (r.reviews || 0) + 1;
  r.mastery = Math.max(0, (r.mastery || 0) - 25);
  r.needReview = true;
  if(r.incorrect >= 2) r.difficult = true;
  r.lastStudied = dateStr(new Date());
  touchStreak();
  saveState();
}

function markNeedReview(id){
  const r = getRec(id);
  r.needReview = true;
  if(r.mastery === 0) r.mastery = 25;
  r.lastStudied = dateStr(new Date());
  touchStreak();
  saveState();
}

function computeStats(){
  let mastered = 0, learning = 0, notStarted = 0, sum = 0, needReview = 0;
  WORDS.forEach(function(w){
    const m = masteryOf(w.id);
    sum += m;
    if(m <= 0) notStarted++;
    else if(m >= 100) mastered++;
    else learning++;
    const r = state.words[w.id];
    if(r && (r.needReview || r.difficult)) needReview++;
  });
  return {
    total: WORDS.length,
    mastered: mastered,
    learning: learning,
    notStarted: notStarted,
    overall: Math.round(sum / WORDS.length),
    needReview: needReview,
    streak: state.streak || 0
  };
}

function reviewIds(){
  return WORDS.filter(function(w){
    const r = state.words[w.id];
    return !!(r && (r.needReview || r.difficult));
  }).map(function(w){ return w.id; });
}

/* =========================================================================
   5. AUDIO
   ========================================================================= */
function playAudio(id){
  const statusEls = document.querySelectorAll('[data-audio-status="' + id + '"]');
  const setStatus = function(text){
    statusEls.forEach(function(el){ el.textContent = text; });
  };
  const src = 'audio/' + id + '.mp3';
  try{
    const audio = new Audio();
    audio.src = src;
    audio.addEventListener('error', function(){ setStatus('Audio unavailable'); });
    audio.addEventListener('playing', function(){ setStatus('Playing British English audio…'); });
    const p = audio.play();
    if(p && typeof p.catch === 'function'){
      p.catch(function(){ setStatus('Audio unavailable'); });
    }
  }catch(e){
    setStatus('Audio unavailable');
  }
}

function audioBlock(w){
  return '' +
    '<div class="audio-block">' +
      '<button type="button" class="btn audio-btn" data-audio="' + esc(w.id) + '" ' +
        'aria-label="Play British English audio for ' + esc(w.noun) + '">🔊 British English audio</button>' +
      '<p class="audio-status" data-audio-status="' + esc(w.id) + '">Audio file not available yet</p>' +
    '</div>';
}

/* =========================================================================

   ========================================================================= */
let currentView = 'home';

function showView(name){
  currentView = name;
  const views = document.querySelectorAll('.view');
  for(let i = 0; i < views.length; i++){
    views[i].classList.toggle('active', views[i].id === 'view-' + name);
  }
  const tabs = document.querySelectorAll('.tab');
  for(let i = 0; i < tabs.length; i++){
    const on = tabs[i].dataset.view === name;
    tabs[i].classList.toggle('active', on);
    if(on) tabs[i].setAttribute('aria-current', 'page');
    else tabs[i].removeAttribute('aria-current');
  }
  renderView(name);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function refresh(){
  renderView(currentView);
}

function renderView(name){
  switch(name){
    case 'home': renderHome(); break;
    case 'learn': renderLearn(); break;
    case 'flashcards': renderFlash(); break;
    case 'words': renderWords(); break;
    case 'practice': renderPractice(); break;
    case 'quiz': renderQuiz(); break;
    case 'review': renderReview(); break;
    case 'progress': renderProgress(); break;
  }
}

function fcNext(){
  deckIdx = (deckIdx + 1) % deck.length;
  flipped = false;
  renderFlash();
}

function fcPrev(){
  deckIdx = (deckIdx - 1 + deck.length) % deck.length;
  flipped = false;
  renderFlash();
}

/* =========================================================================
   10. WORD BANK (SEARCH + FILTER)
   ========================================================================= */
const FILTERS = [
  { key:'all', label:'All' },
  { key:'notstarted', label:'Not started' },
  { key:'learning', label:'Learning' },
  { key:'almost', label:'Almost mastered' },
  { key:'mastered', label:'Mastered' },
  { key:'review', label:'Need review' },
  { key:'lesscommon', label:'Less common / formal' }
];

let searchQuery = '';
let activeFilter = 'all';

function matchesFilter(w){
  const m = masteryOf(w.id);
  const r = state.words[w.id];
  switch(activeFilter){
    case 'notstarted': return m <= 0;
    case 'learning': return m > 0 && m < 75;
    case 'almost': return m === 75;
    case 'mastered': return m >= 100;
    case 'review': return !!(r && (r.needReview || r.difficult));
    case 'lesscommon': return !!w.lessCommon;
    default: return true;
  }
}

function matchesSearch(w){
  if(!searchQuery.trim()) return true;
  const q = normSearch(searchQuery.trim());
  return normSearch(w.adj).indexOf(q) !== -1 ||
         normSearch(w.noun).indexOf(q) !== -1 ||
         normSearch(w.vi).indexOf(q) !== -1;
}

function wordCardHtml(w){
  const m = masteryOf(w.id);
  return '' +
    '<article class="word-card">' +
      '<div class="wc-head">' +
        '<p class="wc-form"><span class="adj">' + esc(w.adj) + '</span>' +
          '<span class="arrow">→</span><span class="noun">' + esc(w.noun) + '</span></p>' +
        '<span class="chip tiny' + (m >= 100 ? ' chip-mastered' : '') + '">' + levelLabel(m) + '</span>' +
      '</div>' +
      '<p class="ipa">' + esc(w.ipa) + '</p>' +
      '<p class="wc-vi">' + esc(w.vi) + '</p>' +
      '<p class="wc-ex">“' + esc(w.example) + '”</p>' +
      '<div class="wc-foot">' +
        '<span class="tag">' + esc(w.level) + '</span>' +
        (w.lessCommon ? '<span class="tag tag-warn">Less common / formal</span>' : '') +
        '<button type="button" class="btn ghost small" data-audio="' + esc(w.id) + '" ' +
          'aria-label="British English audio for ' + esc(w.noun) + '">🔊</button>' +
        '<button type="button" class="btn ghost small" data-why="' + esc(w.id) + '" aria-expanded="false">Why?</button>' +
      '</div>' +
      '<div class="why-box" data-why-box="' + esc(w.id) + '" hidden><p>' + esc(w.why) + '</p></div>' +
    '</article>';
}

function renderWords(){
  const el = document.getElementById('view-words');

  if(!el.dataset.built){
    let chips = '';
    FILTERS.forEach(function(f){
      chips += '<button type="button" class="chip-btn' + (f.key === 'all' ? ' active' : '') + '" ' +
        'data-filter="' + f.key + '">' + esc(f.label) + '</button>';
    });

    el.innerHTML = '' +
      '<div class="card">' +
        '<label class="label" for="searchInput">Search / Tìm kiếm</label>' +
        '<input id="searchInput" class="input" type="search" placeholder="curious, curiosity, tò mò…" ' +
          'autocomplete="off" enterkeyhint="search">' +
        '<div class="chips" role="group" aria-label="Filter words">' + chips + '</div>' +
      '</div>' +
      '<div id="wordList" class="word-list"></div>';

    el.dataset.built = '1';

    const input = el.querySelector('#searchInput');
    input.value = searchQuery;
    input.addEventListener('input', function(){
      searchQuery = input.value;
      renderWordList();
    });
  }

  updateFilterChips();
  renderWordList();
}

function updateFilterChips(){
  const el = document.getElementById('view-words');
  if(!el) return;
  const btns = el.querySelectorAll('.chip-btn');
  for(let i = 0; i < btns.length; i++){
    btns[i].classList.toggle('active', btns[i].dataset.filter === activeFilter);
  }
}

function renderWordList(){
  const list = document.getElementById('wordList');
  if(!list) return;

  const found = WORDS.filter(function(w){
    return matchesFilter(w) && matchesSearch(w);
  });

  if(found.length === 0){
    list.innerHTML = '<div class="card center"><p class="muted">Không tìm thấy từ nào. / No words found.</p></div>';
    return;
  }

  let html = '';
  found.forEach(function(w){ html += wordCardHtml(w); });
  list.innerHTML = html;
}

let prac = null;

function makeExercise(id){
  const w = WORD_BY_ID[id];
  const t = 1 + Math.floor(Math.random() * 5);
  const nouns = WORDS.map(function(x){ return x.noun; });
  const adjs = WORDS.map(function(x){ return x.adj; });
  const blank = blankSentence(w.example, w.noun);

  if(t === 1){
    return {
      wordId:id, label:'Type 1 — Adjective → Noun', type:'type',
      q:'Complete the sentence with the correct noun.<br><em>“' + esc(blank) + '”</em>',
      hint:'Adjective: <strong>' + esc(w.adj) + '</strong>',
      answer:w.noun, explanation:w.adj + ' → ' + w.noun, meaning:w.vi
    };
  }
  if(t === 2){
    return {
      wordId:id, label:'Type 2 — Multiple Choice', type:'mc',
      q:'Choose the correct noun:<br><strong>' + esc(w.adj) + '</strong> → ?',
      options:buildOptions(w.noun, nouns),
      hint:'Nghĩa: <strong>' + esc(w.vi) + '</strong>',
      answer:w.noun, explanation:w.adj + ' → ' + w.noun, meaning:w.vi
    };

    };
  }
  if(t === 4){
    return {
      wordId:id, label:'Type 4 — Reverse', type:'type',
      q:'Give the adjective:<br><strong>' + esc(w.noun) + '</strong> → ?',
      hint:'Nghĩa: <strong>' + esc(w.vi) + '</strong>',
      answer:w.adj, explanation:w.noun + ' → ' + w.adj, meaning:w.vi

let quiz = null;

function makeQuizQuestion(id, type){
  const w = WORD_BY_ID[id];
  const nouns = WORDS.map(function(x){ return x.noun; });
  const adjs = WORDS.map(function(x){ return x.adj; });
  const meanings = WORDS.map(function(x){ return x.vi; });
  const blank = blankSentence(w.example, w.noun);

  switch(type){
    case 'adj2noun':
      return {
        wordId:id, label:'Adjective → Noun', type:'mc',
        q:'What is the noun form of <strong>' + esc(w.adj) + '</strong>?',
        options:buildOptions(w.noun, nouns),
        answer:w.noun, hint:w.adj + ' → ?',
        explanation:w.adj + ' → ' + w.noun, meaning:w.vi
      };
    case 'noun2adj':
      return {
        wordId:id, label:'Noun → Adjective', type:'mc',
        q:'What is the adjective form of <strong>' + esc(w.noun) + '</strong>?',
        options:buildOptions(w.adj, adjs),
        answer:w.adj, hint:w.noun + ' → ?',
        explanation:w.noun + ' → ' + w.adj, meaning:w.vi
      };
    case 'meaning':
      return {
        wordId:id, label:'Meaning', type:'mc',
        q:'What does <strong>' + esc(w.noun) + '</strong> mean?',
        options:buildOptions(w.vi, meanings),
        answer:w.vi, hint:w.adj + ' → ' + w.noun,
        explanation:w.adj + ' → ' + w.noun, meaning:w.vi
      };
    case 'ipa':
      return {
        wordId:id, label:'IPA recognition', type:'mc',
        q:'Which word is pronounced <strong>' + esc(w.ipa) + '</strong>?',
        options:buildOptions(w.noun, nouns),
        answer:w.noun, hint:'British English IPA',
        explanation:w.noun + ' ' + w.ipa, meaning:w.vi
      };
    case 'sentence':
      return {
        wordId:id, label:'Sentence completion', type:'mc',
        q:'Choose the correct word:<br><em>“' + esc(blank) + '”</em>',
        options:buildOptions(w.noun, adjs.concat(nouns)),
        answer:w.noun, hint:'Adjective: ' + w.adj,
        explanation:w.adj + ' → ' + w.noun, meaning:w.vi
      };
    default:
      return {
        wordId:id, label:'Fill in the blank', type:'type',
        q:'Complete the sentence:<br><em>“' + esc(blank) + '”</em>',
        options:null, answer:w.noun,
        hint:'Adjective: ' + w.adj + ' · Nghĩa: ' + w.vi,
        explanation:w.adj + ' → ' + w.noun, meaning:w.vi
      };
  }
}

function startQuiz(count, isFinal){
  const n = (count === 0 || !count) ? WORDS.length : Math.min(count, WORDS.length);
  const ids = shuffle(WORDS.map(function(w){ return w.id; })).slice(0, n);
  const types = shuffle(QUIZ_TYPES);
  const questions = ids.map(function(id, i){
    return makeQuizQuestion(id, types[i % types.length]);
  });
  quiz = {
    questions: questions,
    idx: 0,
    answers: [],
    correct: 0,
    final: !!isFinal,
    answered: false,
    given: null,
    lastOk: null,
    hintShown: false
  };
  renderQuiz();
}

function renderQuiz(){
  const el = document.getElementById('view-quiz');

  if(!quiz){
    el.innerHTML = '' +
      '<div class="card">' +
        '<h2 class="card-title">Vocabulary Quiz</h2>' +
        '<p class="muted" style="margin-bottom:12px;">Câu hỏi ngẫu nhiên, trộn nhiều dạng: adjective → noun, noun → adjective, nghĩa, IPA, hoàn thành câu, điền vào chỗ trống.</p>' +
        '<div class="row-actions">' +
          '<button type="button" class="btn primary lg" data-action="quiz-start" data-count="10">10 questions</button>' +

          '<button type="button" class="btn lg" data-action="quiz-start" data-count="0">All 20 questions</button>' +

      '<div class="card">' +
        '<h2 class="card-title">🏁 Final Challenge</h2>' +
        '<p class="muted" style="margin-bottom:12px;">20 câu hỏi · toàn bộ 20 từ · không có gợi ý (no hints).</p>' +
        '<button type="button" class="btn primary lg full" data-action="quiz-start" data-count="20" data-final="1">Start Final Challenge</button>' +
      '</div>';
    return;
  }

  if(quiz.idx >= quiz.questions.length){
    renderQuizResults();
    return;
  }

  const q = quiz.questions[quiz.idx];
  const total = quiz.questions.length;
  const isLast = quiz.idx === total - 1;

  let hintHtml = '';

      '<span class="chip">' + (quiz.final ? '🏁 Final Challenge' : 'Quiz') + ' · Question ' + (quiz.idx + 1) + ' / ' + total + '</span>' +

    '</div>' +

      '<p class="eyebrow">' + esc(q.label) + '</p>' +
      '<p class="question">' + q.q + '</p>' +
      hintHtml +
      questionBodyHtml(q, quiz.answered, quiz.given) +
      (quiz.answered ? feedbackHtml(q, quiz.lastOk, isLast) : '') +
    '</div>';

function renderQuizResults(){

      '<p class="muted">' + pct + '%</p>' +
      '<div class="progress" style="margin-top:14px;" role="progressbar" aria-valuemin="0" ' +

        '<div class="progress-fill" style="width:' + pct + '%"></div>' +
      '</div>' +
      '<div class="row-actions">' +
        '<button type="button" class="btn primary lg" data-action="quiz-retry">Retry (reshuffled)</button>' +
        '<button type="button" class="btn lg" data-action="quiz-exit">Back to Quiz menu</button>' +
      '</div>' +

    '<div class="card">' +

    (wrong.length
      ? '<div class="card"><h2 class="card-title">Review My Mistakes</h2>' +

        '<div class="word-list">' + wrongHtml + '</div>' +
        '<div class="row-actions" style="margin-top:16px;">' +
          '<button type="button" class="btn primary lg" data-action="practise-mistakes">Practise Again</button>' +
        '</div>'
      : '<div class="card center"><p class="ok-msg">Perfect! Không có lỗi nào. 🎉</p></div>');
}

function submitQuizAnswer(value){
  if(!quiz || quiz.answered) return;
  const q = quiz.questions[quiz.idx];
  const ok = normAnswer(value) === normAnswer(q.answer);
  quiz.answered = true;
  quiz.given = value;
  quiz.lastOk = ok;
  quiz.answers.push({
    wordId: q.wordId, ok: ok, given: value, answer: q.answer, label: q.label
  });
  if(ok){
    quiz.correct++;
    markCorrect(q.wordId);
  }else{
    markIncorrect(q.wordId);
  }
  renderQuiz();
}

function nextQuiz(){
  if(!quiz) return;
  quiz.idx++;
  quiz.answered = false;
  quiz.given = null;
  quiz.lastOk = null;
  quiz.hintShown = false;

  if(quiz.idx >= quiz.questions.length){
    state.quizzes.push({
      date: dateStr(new Date()),
      correct: quiz.correct,
      total: quiz.questions.length,
      final: quiz.final
    });
    if(state.quizzes.length > 30) state.quizzes = state.quizzes.slice(-30);
    saveState();
  }
  renderQuiz();
}

  }

  let cards = '';
  ids.forEach(function(id){ cards += wordCardHtml(WORD_BY_ID[id]); });

  el.innerHTML = '' +
    '<div class="card">' +
      '<h2 class="card-title">Smart Review — ' + ids.length + ' word' + (ids.length > 1 ? 's' : '') + '</h2>' +
      '<p class="muted" style="margin-bottom:12px;">Những từ bạn đã trả lời sai hoặc đánh dấu “Need review”.</p>' +
      '<button type="button" class="btn primary lg full" data-action="practise-again">Practise Again</button>' +
    '</div>' +
    '<div class="word-list">' + cards + '</div>';
}

/* =========================================================================
   14. PROGRESS
   ========================================================================= */
function renderProgress(){
  const s = computeStats();
  const el = document.getElementById('view-progress');

  const ranked = WORDS.map(function(w){
    const r = state.words[w.id] || {};
    return { w:w, m:masteryOf(w.id), correct:r.correct || 0, incorrect:r.incorrect || 0, last:r.lastStudied || null };
  });

  const strongest = ranked.slice().sort(function(a, b){
    return (b.m - a.m) || (b.correct - a.correct);
  }).slice(0, 5);

  const weakest = ranked.slice().sort(function(a, b){
    return (a.m - b.m) || (b.incorrect - a.incorrect);
  }).slice(0, 5);

  let strongHtml = '';
  strongest.forEach(function(x){
    strongHtml += '<li><span class="mini-form">' + esc(x.w.adj) + ' → <span class="noun">' +
      esc(x.w.noun) + '</span></span><span class="mini-val">' + x.m + '%</span></li>';
  });

  let weakHtml = '';
  weakest.forEach(function(x){
    weakHtml += '<li><span class="mini-form">' + esc(x.w.adj) + ' → <span class="noun">' +
      esc(x.w.noun) + '</span></span><span class="mini-val">' + x.m + '%</span></li>';
  });

  let historyHtml = '';
  if(state.quizzes.length === 0){
    historyHtml = '<p class="muted">Chưa có quiz nào. / No quizzes yet.</p>';
  }else{
    state.quizzes.slice(-5).reverse().forEach(function(q){
      historyHtml += '<div class="stat-row"><span>' + esc(q.date) +
        (q.final ? ' · Final Challenge' : ' · Quiz') + '</span><strong>' +
        q.correct + '/' + q.total + '</strong></div>';
    });
  }

  el.innerHTML = '' +
    '<div class="stat-grid">' +
      '<div class="stat"><span class="stat-num">' + s.total + '</span><span class="stat-label">Words</span></div>' +
      '<div class="stat"><span class="stat-num">' + s.mastered + '</span><span class="stat-label">Mastered</span></div>' +
      '<div class="stat"><span class="stat-num">' + s.learning + '</span><span class="stat-label">Learning</span></div>' +
      '<div class="stat"><span class="stat-num">' + s.needReview + '</span><span class="stat-label">Need review</span></div>' +
      '<div class="stat"><span class="stat-num">' + s.overall + '%</span><span class="stat-label">Progress</span></div>' +
      '<div class="stat"><span class="stat-num">' + s.streak + '</span><span class="stat-label">Day streak</span></div>' +
    '</div>' +

    '<div class="card">' +
      '<h2 class="card-title">Overall Progress</h2>' +
      '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" ' +
        'aria-valuenow="' + s.overall + '" aria-label="Overall progress">' +
        '<div class="progress-fill" style="width:' + s.overall + '%"></div>' +
      '</div>' +
      '<p class="muted center" style="margin-top:10px;">' + s.overall + '% · ' +
        s.mastered + ' mastered · ' + s.learning + ' learning · ' + s.notStarted + ' not started</p>' +
    '</div>' +

    '<div class="card">' +
      '<h2 class="card-title">Strongest words</h2>' +
      '<ul class="list-mini">' + strongHtml + '</ul>' +
    '</div>' +

    '<div class="card">' +
      '<h2 class="card-title">Words to review</h2>' +
      '<ul class="list-mini">' + weakHtml + '</ul>' +
    '</div>' +

    '<div class="card">' +
      '<h2 class="card-title">Recent quiz scores</h2>' +
      historyHtml +
    '</div>' +

    '<div class="card">' +
      '<h2 class="card-title">Reset</h2>' +
      '<p class="muted" style="margin-bottom:12px;">Xoá toàn bộ tiến độ học và bắt đầu lại từ đầu.</p>' +
      '<button type="button" class="btn danger full" data-action="reset-open">Reset Progress</button>' +
    '</div>';
}

/* =========================================================================
   15. WHY? TOGGLE
   ========================================================================= */
function toggleWhy(btn){
  const id = btn.dataset.why;
  const container = btn.closest('.card, .word-card, .learn-card') || document;
  const box = container.querySelector('[data-why-box="' + id + '"]');
  if(!box) return;
  box.hidden = !box.hidden;
  btn.setAttribute('aria-expanded', String(!box.hidden));
}

function showHint(){
  if(currentView === 'practice' && prac && !prac.answered){
    const ex = prac.items[prac.idx];
    const slot = document.querySelector('#view-practice [data-hint-slot]');
    if(slot && ex.hint) slot.innerHTML = '<p class="hint-text">' + ex.hint + '</p>';
  }
  if(currentView === 'quiz' && quiz && !quiz.answered && !quiz.final){
    const q = quiz.questions[quiz.idx];
    const slot = document.querySelector('#view-quiz [data-hint-slot]');
    if(slot && q.hint){
      slot.innerHTML = '<p class="hint-text">' + esc(q.hint) + '</p>';
      quiz.hintShown = true;
    }
  }
}

/* =========================================================================
   16. EVENT DELEGATION
   ========================================================================= */
document.addEventListener('click', function(e){
  const tab = e.target.closest('.tab');
  if(tab){
    showView(tab.dataset.view);
    return;
  }

  const audioBtn = e.target.closest('[data-audio]');
  if(audioBtn){
    playAudio(audioBtn.dataset.audio);
    return;
  }

  const whyBtn = e.target.closest('[data-why]');
  if(whyBtn){
    toggleWhy(whyBtn);
    return;
  }

  const filterBtn = e.target.closest('[data-filter]');
  if(filterBtn){
    activeFilter = filterBtn.dataset.filter;
    updateFilterChips();
    renderWordList();
    return;
  }

  const actionBtn = e.target.closest('[data-action]');
  if(actionBtn){
    handleAction(actionBtn.dataset.action, actionBtn);
    return;
  }

  const fc = e.target.closest('#flashcard');
  if(fc){
    fcFlip();
  }
});

document.addEventListener('keydown', function(e){
  if((e.key === 'Enter' || e.key === ' ') && e.target && e.target.id === 'flashcard'){
    e.preventDefault();
    fcFlip();
  }
});

document.addEventListener('submit', function(e){
  const form = e.target.closest('[data-form="answer"]');
  if(!form) return;
  e.preventDefault();
  const input = form.querySelector('input');
  if(!input) return;
  const val = input.value.trim();
  if(!val) return;
  if(currentView === 'practice') submitPracticeAnswer(val);
  else if(currentView === 'quiz') submitQuizAnswer(val);
});

function handleAction(action, btn){
  switch(action){
    /* navigation */
    case 'go-home': showView('home'); break;
    case 'go-learn': showView('learn'); break;
    case 'go-flashcards': showView('flashcards'); break;
    case 'go-words': showView('words'); break;
    case 'go-practice': showView('practice'); break;
    case 'go-quiz': showView('quiz'); break;
    case 'go-review': showView('review'); break;
    case 'go-progress': showView('progress'); break;

    /* home */
    case 'start-review': {
      const ids = reviewIds();
      if(ids.length) startPractice(ids, 'Daily Review');
      else showView('review');
      break;
    }

    /* learn */
    case 'reveal':
      learnRevealed = true;
      markSeen(WORDS[learnIdx].id);
      renderLearn();
      break;
    case 'learn-next': learnNext(); break;
    case 'learn-prev': learnPrev(); break;
    case 'know': {
      const id = btn.dataset.id;
      markCorrect(id);
      learnNext();
      break;
    }
    case 'review-flag': {
      const id = btn.dataset.id;
      markNeedReview(id);
      learnNext();
      break;
    }

    /* flashcards */
    case 'fc-flip': fcFlip(); break;
    case 'fc-next': fcNext(); break;
    case 'fc-prev': fcPrev(); break;
    case 'fc-shuffle': initDeck(); renderFlash(); break;
    case 'fc-know': {
      const id = deck[deckIdx];
      markCorrect(id);
      fcNext();
      break;
    }
    case 'fc-review': {
      const id = deck[deckIdx];
      markNeedReview(id);
      fcNext();
      break;
    }

    /* practice */
    case 'practice-start': startPractice(null, 'Word Formation Practice'); break;
    case 'practise-again': {
      const ids = reviewIds();
      if(ids.length) startPractice(ids, 'Smart Review');
      else showView('review');
      break;
    }
    case 'practise-mistakes': {
      if(!quiz) break;
      const ids = quiz.answers.filter(function(a){ return !a.ok; }).map(function(a){ return a.wordId; });
      const unique = ids.filter(function(v, i){ return ids.indexOf(v) === i; });
      if(unique.length) startPractice(unique, 'Review My Mistakes');
      else showView('practice');
      break;
    }

    /* quiz */
    case 'quiz-start': {
      const count = parseInt(btn.dataset.count, 10) || 0;
      startQuiz(count, btn.dataset.final === '1');
      break;
    }
    case 'quiz-retry': {
      const total = quiz ? quiz.questions.length : 10;
      const isFinal = quiz ? quiz.final : false;
      startQuiz(total, isFinal);
      break;
    }
    case 'quiz-exit': quiz = null; renderQuiz(); break;

    /* shared question flow */
    case 'answer': {
      const val = btn.dataset.value;
      if(currentView === 'practice') submitPracticeAnswer(val);
      else if(currentView === 'quiz') submitQuizAnswer(val);
      break;
    }
    case 'next-q':
      if(currentView === 'practice') nextPractice();
      else if(currentView === 'quiz') nextQuiz();
      break;
    case 'hint': showHint(); break;

    /* reset */
    case 'reset-open': {
      const dlg = document.getElementById('confirmReset');
      if(dlg && typeof dlg.showModal === 'function'){
        dlg.showModal();
      }else if(window.confirm('Reset all progress? This cannot be undone.')){
        doReset();
      }
      break;
    }
    case 'reset-cancel': {
      const dlg = document.getElementById('confirmReset');
      if(dlg && typeof dlg.close === 'function') dlg.close();
      break;
    }
    case 'reset-confirm': {
      const dlg = document.getElementById('confirmReset');
      if(dlg && typeof dlg.close === 'function') dlg.close();
      doReset();
      break;
    }
  }
}

function doReset(){
  state = { words:{}, streak:0, lastStudyDate:null, quizzes:[] };
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  saveState();

  learnIdx = 0;
  learnRevealed = false;
  deck = null;
  deckIdx = 0;
  flipped = false;
  prac = null;
  quiz = null;
  searchQuery = '';
  activeFilter = 'all';

  const wordsView = document.getElementById('view-words');
  if(wordsView){
    wordsView.dataset.built = '';
    wordsView.innerHTML = '';
  }

  showView('home');
}

/* =========================================================================
   17. INIT
   ========================================================================= */
loadState();
showView('home');
</script>
